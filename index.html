<!DOCTYPE html>

<html lang="mn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ONEGO Mongolia</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}

header{background:#fff;padding:14px;position:sticky;top:0;z-index:10}

.logo{font-size:26px;font-weight:bold;color:#e53935}

.logo span{color:#333}

.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:12px;font-size:16px}

.banner{margin:12px;background:#e53935;color:white;padding:20px;border-radius:14px}

.banner h2{margin:0 0 8px}

.banner p{margin:0}

.section{padding:12px}

.section h3{margin:5px 0 12px}

.categories{display:flex;gap:8px;overflow:auto}

.categories button{border:0;background:white;padding:10px 15px;border-radius:20px;white-space:nowrap}

.products{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.card{background:white;border-radius:12px;overflow:hidden;padding-bottom:12px}

.photo{height:130px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:50px}

.card h4{margin:10px;font-size:15px}

.price{color:#e53935;font-weight:bold;margin:0 10px}

.old{color:#999;text-decoration:line-through;font-size:12px;margin-left:5px}

.group{margin:8px 10px;color:#e53935;font-size:12px}

.card button{margin:8px 10px 0;width:calc(100% - 20px);padding:10px;background:#e53935;color:white;border:0;border-radius:8px}

.bottom{position:sticky;bottom:0;background:white;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #ddd}

.bottom a{color:#333;text-decoration:none;font-size:13px}

</style>

</head>

<body>

<header>

  <div class="logo">ONEGO <span>MONGOLIA</span></div>

  <input class="search" id="search" placeholder="Бараа хайх..." oninput="searchProducts()">

</header>

<div class="banner">

  <h2>ONEGO хямдрал!</h2>

  <p>Групп захиалгаар илүү хямд үнэ</p>

</div>

<div class="section">

  <h3>Ангилал</h3>

  <div class="categories">

    <button onclick="filter('all')">Бүгд</button>

    <button onclick="filter('Гэр ахуй')">Гэр ахуй</button>

    <button onclick="filter('Гоо сайхан')">Гоо сайхан</button>

    <button onclick="filter('Цахилгаан')">Цахилгаан</button>

    <button onclick="filter('Хувцас')">Хувцас</button>

  </div>

</div>

<div class="section">

  <h3>🔥 Онцлох бараа</h3>

  <div class="products" id="products"></div>

</div>

<div class="section">

  <h3>🛒 Миний сагс: <span id="cart">0</span> бараа</h3>

</div>

<div class="bottom">

  <a href="#">🏠 Нүүр</a>

  <a href="#products">🛍️ Шоп</a>

  <a href="#products">👥 Групп</a>

  <a href="#">🛒 Сагс</a>

  <a href="#">👤 Миний</a>

</div>

<script>

const items=[

 {name:"Ухаалаг гэрлийн чийдэн",price:25000,group:19000,cat:"Цахилгаан",icon:"💡"},

 {name:"Гал тогооны зохион байгуулагч",price:18000,group:13000,cat:"Гэр ахуй",icon:"🍽️"},

 {name:"Арьс арчилгааны багц",price:35000,group:27000,cat:"Гоо сайхан",icon:"🧴"},

 {name:"Өвлийн дулаан оймс",price:12000,group:8000,cat:"Хувцас",icon:"🧦"},

 {name:"USB цэнэглэгч",price:22000,group:16000,cat:"Цахилгаан",icon:"🔌"},

 {name:"Усны сав",price:15000,group:10000,cat:"Гэр ахуй",icon:"🥤"}

];

let cart=0;

let current="all";

function showProducts(list){

 document.getElementById("products").innerHTML=list.map((p,i)=>`

 <div class="card">

 <div class="photo">${p.icon}</div>

 <h4>${p.name}</h4>

 <div class="price">${p.price.toLocaleString()}₮

 <span class="old">${(p.price*1.2).toLocaleString()}₮</span></div>

 <div class="group">👥 Групп үнэ: ${p.group.toLocaleString()}₮</div>

 <button onclick="addCart()">Сагсанд нэмэх</button>

 <button onclick="joinGroup(${i})">Групп захиалах</button>

 </div>`).join("");

}

function addCart(){

 cart++;

 document.getElementById("cart").innerText=cart;

 alert("Сагсанд нэмэгдлээ!");

}

function joinGroup(i){

 alert(items[i].name+" — групп захиалгын demo. Захиалгын системийг дараа холбож болно.");

}

function filter(cat){

 current=cat;

 showProducts(cat==="all"?items:items.filter(p=>p.cat===cat));

}

function searchProducts(){

 let q=document.getElementById("search").value.toLowerCase();

 showProducts(items.filter(p=>p.name.toLowerCase().includes(q)));

}

showProducts(items);

</script>

</body>

</html>
